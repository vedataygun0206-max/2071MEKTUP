<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b1220"><title>2071 Mektup</title><style>body{margin:0;background:#07111f;color:#eef4ff;font-family:system-ui}.wrap{max-width:900px;margin:auto;padding:22px}.hero{text-align:center;padding:30px}.logo{font-size:42px;font-weight:800}.tag{color:#9eb5d3}.card{background:#0e1b2d;border:1px solid #20334e;border-radius:18px;padding:20px;margin:14px 0}input,textarea,select{width:100%;padding:12px;margin:6px 0;background:#091525;color:#fff;border:1px solid #314762;border-radius:10px;box-sizing:border-box}button{padding:12px 16px;border:0;border-radius:10px;margin:4px;font-weight:700}.primary{background:#e7c76a}.secondary{background:#1d314b;color:#fff}.count{font-size:42px;font-weight:800}.badge{background:#19395c;padding:5px 9px;border-radius:20px;font-size:12px}</style></head><body><div class="wrap"><section class="hero"><div class="logo">2071 MEKTUP</div><div class="tag">Bugünü mühürle, geleceğe bırak.</div><div class="count" id="count">--</div></section><section class="card"><span class="badge">🧪 TEST HAKKI</span><h2>Önce sistemi deneyin</h2><p>Her kullanıcıya 1 test kapsülü verilir.</p><button class="primary" onclick="test()">Test kapsülünü oluştur</button><p id="msg"></p></section><section class="card"><span class="badge">🔐 GERÇEK KAPSÜL</span><h2>Yeni kapsül</h2><input id="title" placeholder="Aileme 2071 mektubu"><input id="date" type="date"><select id="visibility"><option value="private">Özel</option><option value="family">Aile</option><option value="public">Kamuya açık</option></select><textarea id="content" rows="7" placeholder="Sevgili 2071..."></textarea><button class="secondary" onclick="draft()">Taslak kaydet</button><button class="primary" onclick="lockDemo()">🔒 Gerçek kapsülü kilitle</button></section><section class="card"><h2>📚 Kapsüllerim</h2><div id="list">Henüz kayıt yok.</div></section></div><script>const k='2071_demo';function arr(){return JSON.parse(localStorage.getItem(k)||'[]')}function save(a){localStorage.setItem(k,JSON.stringify(a));render()}function test(){let a=arr();if(a.some(x=>x.mode==='test'))return msg.textContent='Test hakkınız kullanıldı.';a.push({mode:'test',title:'Test Kapsülü',status:'TEST'});save(a);msg.textContent='1 test hakkı kullanıldı.'}function draft(){let a=arr();a.push({mode:'real',title:title.value||'Adsız',status:'DRAFT',unlockAt:date.value,visibility:visibility.value,content:content.value});save(a)}function lockDemo(){if(!date.value)return alert('Açılış tarihini seçin.');alert('Demo: Gerçek kilit sunucu API bağlandığında devreye girecek.');draft()}function render(){let a=arr();list.innerHTML=a.length?a.map(x=>`<div class="card"><b>${x.mode==='test'?'🧪 TEST':'🔐 GERÇEK'}</b><h3>${x.title}</h3><p>Durum: ${x.status}</p><p>Açılış: ${x.unlockAt||'Test'}</p></div>`).join(''):'Henüz kayıt yok.'}function tick(){let t=new Date('2071-08-22T00:00:00')-Date.now();let d=Math.max(0,Math.floor(t/86400000));count.textContent=d.toLocaleString('tr-TR')+' gün'}setInterval(tick,1000);tick();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');</script></body></html>
